<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoQuiz</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <h1>GeoQuiz</h1>
  <button class="ingresar" id="btnCerrarSesion" type="button" style="margin-bottom:16px;">Cerrar sesión</button>

  <div id="panel-docente" style="display:none;">
    <h2>Panel Docente</h2>

    <h3>Crear tema</h3>
    <div class="campo">
      <label for="nuevoTemaNombre">Nombre del tema</label>
      <input type="text" id="nuevoTemaNombre" placeholder="Ej: Historia Argentina">
    </div>
    <div class="campo">
      <label for="nuevoTemaDescripcion">Descripción</label>
      <input type="text" id="nuevoTemaDescripcion" placeholder="Descripción del tema">
    </div>
    <button class="ingresar" id="btnCrearTema" type="button">Crear tema</button>
    <p id="mensajeTema" style="margin-top:8px;"></p>

    <div class="campo">
      <label for="temaDocente">Tema / materia</label>
      <select id="temaDocente">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="preguntaDocente">Pregunta</label>
      <input type="text" id="preguntaDocente" placeholder="Ej: ¿Qué lenguaje se usa para crear páginas web?">
    </div>

    <div class="campo">
      <label for="opcion1">Opción 1</label>
      <input type="text" id="opcion1" placeholder="Respuesta 1">
    </div>

    <div class="campo">
      <label for="opcion2">Opción 2</label>
      <input type="text" id="opcion2" placeholder="Respuesta 2">
    </div>

    <div class="campo">
      <label for="opcion3">Opción 3</label>
      <input type="text" id="opcion3" placeholder="Respuesta 3">
    </div>

    <div class="campo">
      <label for="respuestaCorrecta">Respuesta correcta</label>
      <select id="respuestaCorrecta">
        <option value="1">Opción 1</option>
        <option value="2">Opción 2</option>
        <option value="3">Opción 3</option>
      </select>
    </div>

    <div class="campo">
      <label for="temaEliminar">Eliminar tema</label>
      <select id="temaEliminar">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="temaResultados">Ver resultados de alumnos</label>
      <select id="temaResultados">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="temaAlumno">Registrar alumno a un tema</label>
      <select id="temaAlumno">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="alumnoDni">DNI del alumno</label>
      <input type="text" id="alumnoDni" placeholder="Ej: 40123456" maxlength="8" pattern="[0-9]*" inputmode="numeric">
    </div>

    <h3>Ubicaciones GPS</h3>
    <p>Seleccioná un punto en el mapa para cargar sus coordenadas automáticamente.</p>
    <div id="mapaUbicaciones" style="height:350px; width:100%; margin:12px 0; border:1px solid #ccc;"></div>
    <button class="ingresar" id="btnUsarUbicacionActual" type="button" style="margin-bottom:8px;">Usar mi ubicación actual</button>
    <div class="campo">
      <label for="ubicacionTema">Tema de la ubicación</label>
      <select id="ubicacionTema">
        <option value="">Cargando temas...</option>
      </select>
    </div>
    <div class="campo">
      <label for="ubicacionExistente">Ubicación existente (opcional)</label>
      <select id="ubicacionExistente">
        <option value="">Crear una ubicación nueva</option>
      </select>
    </div>
    <div class="campo">
      <label for="ubicacionNombre">Nombre del lugar</label>
      <input type="text" id="ubicacionNombre" placeholder="Ej: Plaza Central">
    </div>
    <div class="campo">
      <label for="ubicacionLatitud">Latitud</label>
      <input type="number" id="ubicacionLatitud" step="any" placeholder="Ej: -34.6037">
    </div>
    <div class="campo">
      <label for="ubicacionLongitud">Longitud</label>
      <input type="number" id="ubicacionLongitud" step="any" placeholder="Ej: -58.3816">
    </div>
    <div class="campo">
      <label for="ubicacionRadio">Radio de detección en metros</label>
      <input type="number" id="ubicacionRadio" min="1" value="50">
    </div>
    <button class="ingresar" id="btnGuardarUbicacion" type="button" style="margin-top:8px;">Guardar ubicación y pregunta</button>
    <div id="ubicacionesDocente" style="margin-top:16px;"></div>

    <h3>Administrar preguntas</h3>
    <div class="campo">
      <label for="preguntasTemaFiltro">Tema</label>
      <select id="preguntasTemaFiltro">
        <option value="">Seleccioná un tema</option>
      </select>
    </div>
    <div id="preguntasDocente" style="margin-top:16px;"></div>

    <button class="ingresar" id="btnRegistrarAlumnoTema" type="button" style="margin-top:8px;">Registrar alumno al tema</button>
    <button class="ingresar" id="btnBorrarTema" type="button" style="margin-top:8px;">Borrar tema seleccionado</button>
    <button class="ingresar" id="btnVerResultados" type="button" style="margin-top:8px;">Ver resultados</button>

    <div id="contenedorResultadosDocente" style="margin-top:16px;"></div>
  </div>

  <div id="panel-alumno" style="display:none;">
    <h2>Panel Alumno</h2>

    <div class="campo">
      <label for="temaInscripcion">Inscribirme a un tema</label>
      <select id="temaInscripcion">
        <option value="">Cargando temas disponibles...</option>
      </select>
    </div>
    <button class="ingresar" id="btnInscribirme" type="button" style="margin-bottom:16px;">Inscribirme</button>

    <div class="campo">
      <label for="temaSeleccionado">Elegí una materia</label>
      <select id="temaSeleccionado">
        <option value="">Cargando materias...</option>
      </select>
    </div>

    <div id="preguntasAlumno"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const rol = localStorage.getItem('rol');

    if (!rol || localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.href = 'index.html';
      throw new Error('No autenticado');
    }

    let preguntasActuales = [];
    let indiceActual = 0;
    let puntaje = 0;
    let respuestas = [];
    let temaActualId = null;
    let resumenTemas = {};
    let preguntasRespondidasTema = {};
    let ubicacionAlumno = null;
    let intervaloUbicacion = null;
    let consultaUbicacionEnCurso = false;
    let mapaDocente = null;
    let marcadorUbicacion = null;

    document.getElementById('btnCerrarSesion').addEventListener('click', cerrarSesion);

    if (rol === 'docente') {
      document.getElementById('panel-docente').style.display = 'block';
      document.getElementById('btnBorrarTema').addEventListener('click', borrarTemaDocente);
      document.getElementById('btnVerResultados').addEventListener('click', verResultadosDocente);
      document.getElementById('btnRegistrarAlumnoTema').addEventListener('click', registrarAlumnoATema);
      document.getElementById('btnGuardarUbicacion').addEventListener('click', guardarUbicacionYPreguntaDocente);
      document.getElementById('btnUsarUbicacionActual').addEventListener('click', usarUbicacionActualDocente);
      document.getElementById('btnCrearTema').addEventListener('click', crearTemaDocente);
      cargarTemasDocente();
      cargarTemasDocenteResultados();
      cargarTemasParaInscripcion();
      cargarTemasParaUbicacion();
      cargarTemasParaPreguntas();
      iniciarMapaDocente();
    } else {
      document.getElementById('panel-alumno').style.display = 'block';
      document.getElementById('btnInscribirme').addEventListener('click', inscribirmeATema);
      cargarTemasDisponiblesParaInscripcion();
      cargarMateriasAlumno();
    }

    async function guardarPreguntaDocente() {
      const temaNombre = document.getElementById('temaDocente').value.trim();
      const pregunta = document.getElementById('preguntaDocente').value.trim();
      const opciones = [
        document.getElementById('opcion1').value.trim(),
        document.getElementById('opcion2').value.trim(),
        document.getElementById('opcion3').value.trim()
      ];
      const correcta = document.getElementById('respuestaCorrecta').value;

      if (!temaNombre || !pregunta || opciones.some(op => !op)) {
        alert('Completá tema, pregunta y las 3 opciones.');
        return;
      }

try {
  const docenteId = localStorage.getItem('docenteId');

  const temaRes = await fetch('http://localhost:3000/api/temas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre: temaNombre, descripcion: 'Materia creada desde el panel docente', docenteId })
  });

        const temaData = await temaRes.json();
        if (!temaRes.ok) {
          alert(temaData.error || 'No se pudo crear el tema');
          return;
        }

        const preguntaRes = await fetch('http://localhost:3000/api/preguntas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            temaId: temaData.id,
            enunciado: pregunta,
            opciones,
            respuestaCorrecta: Number(correcta)
          })
        });

        const preguntaData = await preguntaRes.json();
        if (!preguntaRes.ok) {
          alert(preguntaData.error || 'No se pudo guardar la pregunta');
          return;
        }

        alert('Pregunta guardada correctamente');
        document.getElementById('temaDocente').value = '';
        document.getElementById('preguntaDocente').value = '';
        document.getElementById('opcion1').value = '';
        document.getElementById('opcion2').value = '';
        document.getElementById('opcion3').value = '';
        await cargarTemasDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function crearTemaDocente() {
      const nombre = document.getElementById('nuevoTemaNombre').value.trim();
      const descripcion = document.getElementById('nuevoTemaDescripcion').value.trim();
      const mensaje = document.getElementById('mensajeTema');
      const docenteId = localStorage.getItem('userId');

      if (!nombre) {
        mensaje.textContent = 'Ingresá el nombre del tema.';
        mensaje.style.color = 'crimson';
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/temas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, descripcion, docenteId })
        });
        const data = await res.json();

        if (!res.ok) {
          mensaje.textContent = data.error || 'No se pudo crear el tema.';
          mensaje.style.color = 'crimson';
          return;
        }

        mensaje.textContent = `Tema creado: ${data.nombre || nombre}. Ahora podés cargarle una ubicación.`;
        mensaje.style.color = 'green';
        document.getElementById('nuevoTemaNombre').value = '';
        document.getElementById('nuevoTemaDescripcion').value = '';
        await Promise.all([
          cargarTemasDocente(),
          cargarTemasDocenteResultados(),
          cargarTemasParaInscripcion(),
          cargarTemasParaUbicacion()
        ]);
        document.getElementById('ubicacionTema').value = String(data.id);
        await cargarUbicacionesDocente();
      } catch (error) {
        mensaje.textContent = 'No se pudo conectar con el servidor.';
        mensaje.style.color = 'crimson';
      }
    }

    async function cargarTemasDocente() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaEliminar');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas para borrar</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaEliminar').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function cargarTemasDocenteResultados() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaResultados');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas para ver resultados</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaResultados').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function cargarTemasParaInscripcion() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaAlumno');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas disponibles</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaAlumno').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function cargarTemasParaUbicacion() {
      const select = document.getElementById('ubicacionTema');

      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        select.innerHTML = '<option value="">Seleccioná un tema</option>';

        if (!Array.isArray(temas) || !temas.length) {
          select.innerHTML = '<option value="">No hay temas activos</option>';
          return;
        }

        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });

        const temaPregunta = document.getElementById('temaDocente');
        temaPregunta.innerHTML = select.innerHTML;
        temaPregunta.addEventListener('change', () => {
          select.value = temaPregunta.value;
          cargarUbicacionesDelTema();
        });
      } catch (error) {
        select.innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }

      select.addEventListener('change', cargarUbicacionesDelTema);
      select.addEventListener('change', () => {
        const temaPregunta = document.getElementById('temaDocente');
        if (temaPregunta) temaPregunta.value = select.value;
      });
    }

    async function cargarTemasParaPreguntas() {
      const filtro = document.getElementById('preguntasTemaFiltro');

      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        filtro.innerHTML = '<option value="">Seleccioná un tema</option>';

        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          filtro.appendChild(option);
        });

        filtro.addEventListener('change', cargarPreguntasDelTema);
      } catch (error) {
        filtro.innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function cargarPreguntasDelTema() {
      const temaId = document.getElementById('preguntasTemaFiltro').value;
      const contenedor = document.getElementById('preguntasDocente');

      if (!temaId) {
        contenedor.innerHTML = '<p>Seleccioná un tema para administrar sus preguntas.</p>';
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/preguntas/todas');
        const preguntas = await res.json();
        const preguntasTema = preguntas.filter(pregunta => String(pregunta.temaId) === String(temaId));

        if (!preguntasTema.length) {
          contenedor.innerHTML = '<p>Este tema no tiene preguntas cargadas.</p>';
          return;
        }

        contenedor.innerHTML = preguntasTema.map(pregunta => `
          <article style="border:1px solid #ccc; padding:12px; margin-bottom:10px;">
            <p><strong>${pregunta.enunciado}</strong></p>
            <p>Opciones: ${pregunta.opcion1}, ${pregunta.opcion2}, ${pregunta.opcion3}</p>
            <p>Respuesta correcta: Opción ${pregunta.correcta}</p>
            <button type="button" onclick="eliminarPreguntaDocente(${pregunta.id})">Eliminar pregunta</button>
          </article>
        `).join('');
      } catch (error) {
        contenedor.innerHTML = '<p>No se pudieron cargar las preguntas.</p>';
      }
    }

    async function eliminarPreguntaDocente(preguntaId) {
      if (!confirm('¿Querés eliminar esta pregunta?')) return;

      try {
        const res = await fetch(`http://localhost:3000/api/preguntas/${preguntaId}`, {
          method: 'DELETE'
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'No se pudo eliminar la pregunta.');
          return;
        }

        alert('Pregunta eliminada correctamente.');
        cargarPreguntasDelTema();
      } catch (error) {
        alert('No se pudo conectar con el servidor.');
      }
    }

    async function cargarUbicacionesDelTema() {
      const temaId = document.getElementById('ubicacionTema').value;
      const select = document.getElementById('ubicacionExistente');
      select.innerHTML = '<option value="">Crear una ubicación nueva</option>';

      if (!temaId) return;

      try {
        const res = await fetch(`http://localhost:3000/api/ubicaciones?temaId=${temaId}`);
        const ubicaciones = await res.json();
        ubicaciones.forEach(ubicacion => {
          const option = document.createElement('option');
          option.value = ubicacion.id;
          option.textContent = `${ubicacion.nombre || 'Sin nombre'} (${ubicacion.latitud}, ${ubicacion.longitud})`;
          option.dataset.nombre = ubicacion.nombre || '';
          option.dataset.latitud = ubicacion.latitud;
          option.dataset.longitud = ubicacion.longitud;
          option.dataset.radio = ubicacion.radio_metros;
          select.appendChild(option);
        });
      } catch (error) {
        select.innerHTML = '<option value="">No se pudieron cargar las ubicaciones</option>';
      }
    }

    document.addEventListener('change', (evento) => {
      if (evento.target.id !== 'ubicacionExistente') return;
      const opcion = evento.target.selectedOptions[0];
      if (!evento.target.value || !opcion) return;
      document.getElementById('ubicacionNombre').value = opcion.dataset.nombre;
      document.getElementById('ubicacionLatitud').value = opcion.dataset.latitud;
      document.getElementById('ubicacionLongitud').value = opcion.dataset.longitud;
      document.getElementById('ubicacionRadio').value = opcion.dataset.radio;
      seleccionarCoordenadas(Number(opcion.dataset.latitud), Number(opcion.dataset.longitud));
    });

    function iniciarMapaDocente() {
      if (!window.L || mapaDocente) return;

      mapaDocente = L.map('mapaUbicaciones').setView([-34.6037, -58.3816], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(mapaDocente);

      mapaDocente.on('click', (evento) => {
        seleccionarCoordenadas(evento.latlng.lat, evento.latlng.lng);
      });

      setTimeout(() => mapaDocente.invalidateSize(), 100);
    }

    function seleccionarCoordenadas(latitud, longitud) {
      const nombreInput = document.getElementById('ubicacionNombre');
      document.getElementById('ubicacionLatitud').value = latitud.toFixed(7);
      document.getElementById('ubicacionLongitud').value = longitud.toFixed(7);
      if (!nombreInput.value.trim()) {
        nombreInput.value = 'Ubicación seleccionada';
      }

      if (marcadorUbicacion) {
        marcadorUbicacion.setLatLng([latitud, longitud]);
      } else {
        marcadorUbicacion = L.marker([latitud, longitud]).addTo(mapaDocente);
      }

      marcadorUbicacion.bindPopup('Ubicación seleccionada').openPopup();
    }

    function usarUbicacionActualDocente() {
      if (!navigator.geolocation) {
        alert('Tu navegador no permite obtener la ubicación.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          seleccionarCoordenadas(coords.latitude, coords.longitude);
          mapaDocente.setView([coords.latitude, coords.longitude], 17);
        },
        () => alert('No se pudo obtener tu ubicación actual.'),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    async function guardarUbicacionDocente() {
      const temaId = document.getElementById('ubicacionTema').value;
      const nombre = document.getElementById('ubicacionNombre').value.trim();
      const latitudTexto = document.getElementById('ubicacionLatitud').value.trim().replace(',', '.');
      const longitudTexto = document.getElementById('ubicacionLongitud').value.trim().replace(',', '.');
      const radioTexto = document.getElementById('ubicacionRadio').value.trim().replace(',', '.');
      const latitud = Number(latitudTexto);
      const longitud = Number(longitudTexto);
      const radio = Number(radioTexto);

      if (!temaId) {
        alert('Seleccioná un tema.');
        return;
      }
      if (!nombre) {
        alert('Ingresá el nombre del lugar.');
        return;
      }
      if (!Number.isFinite(latitud) || latitud < -90 || latitud > 90) {
        alert('La latitud debe ser un número entre -90 y 90.');
        return;
      }
      if (!Number.isFinite(longitud) || longitud < -180 || longitud > 180) {
        alert('La longitud debe ser un número entre -180 y 180.');
        return;
      }
      if (!Number.isFinite(radio) || radio <= 0) {
        alert('El radio debe ser un número mayor a cero, por ejemplo 50.');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/ubicaciones', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            temaId,
            nombre,
            latitud,
            longitud,
            radio_metros: radio
          })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'No se pudo guardar la ubicación.');
          return;
        }

        alert('Ubicación GPS guardada correctamente.');
        document.getElementById('ubicacionNombre').value = '';
        document.getElementById('ubicacionLatitud').value = '';
        document.getElementById('ubicacionLongitud').value = '';
        await cargarUbicacionesDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor.');
      }
    }

    async function guardarUbicacionYPreguntaDocente() {
      const temaId = document.getElementById('ubicacionTema').value;
      const ubicacionId = document.getElementById('ubicacionExistente').value;
      const opcionUbicacion = document.getElementById('ubicacionExistente').selectedOptions[0];
      const nombreIngresado = document.getElementById('ubicacionNombre').value.trim();
      const latitudTexto = document.getElementById('ubicacionLatitud').value.trim().replace(',', '.');
      const longitudTexto = document.getElementById('ubicacionLongitud').value.trim().replace(',', '.');
      const radioTexto = document.getElementById('ubicacionRadio').value.trim().replace(',', '.');
      const nombre = ubicacionId ? (opcionUbicacion?.dataset.nombre || nombreIngresado) : nombreIngresado;
      const latitud = ubicacionId ? Number(opcionUbicacion?.dataset.latitud || latitudTexto) : Number(latitudTexto);
      const longitud = ubicacionId ? Number(opcionUbicacion?.dataset.longitud || longitudTexto) : Number(longitudTexto);
      const radio = ubicacionId ? Number(opcionUbicacion?.dataset.radio || radioTexto) : Number(radioTexto);
      const enunciado = document.getElementById('preguntaDocente').value.trim();
      const opciones = [
        document.getElementById('opcion1').value.trim(),
        document.getElementById('opcion2').value.trim(),
        document.getElementById('opcion3').value.trim()
      ];
      const respuestaCorrecta = document.getElementById('respuestaCorrecta').value;

      if (!temaId) {
        alert('Seleccioná un tema.');
        return;
      }

      if (!ubicacionId && !nombre) {
        alert('Ingresá el nombre del lugar o elegí una ubicación existente.');
        return;
      }

      if (!Number.isFinite(latitud) || !Number.isFinite(longitud) || !Number.isFinite(radio) || radio <= 0) {
        alert('Seleccioná una ubicación del mapa o completá latitud, longitud y radio.');
        return;
      }

      if (!enunciado || opciones.some(opcion => !opcion)) {
        alert('Completá la pregunta y las 3 opciones antes de guardar.');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/ubicaciones/con-pregunta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            temaId,
            ubicacionId: ubicacionId || null,
            nombre,
            latitud,
            longitud,
            radio_metros: radio,
            enunciado,
            opciones,
            respuestaCorrecta
          })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'No se pudieron guardar la ubicación y la pregunta.');
          return;
        }

        alert('Ubicación y pregunta guardadas correctamente.');
        document.getElementById('ubicacionNombre').value = '';
        document.getElementById('ubicacionLatitud').value = '';
        document.getElementById('ubicacionLongitud').value = '';
        document.getElementById('preguntaDocente').value = '';
        document.getElementById('opcion1').value = '';
        document.getElementById('opcion2').value = '';
        document.getElementById('opcion3').value = '';
        await cargarUbicacionesDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor.');
      }
    }

    async function cargarUbicacionesDocente() {
      const contenedor = document.getElementById('ubicacionesDocente');
      const temaId = document.getElementById('ubicacionTema').value;

      if (!temaId) {
        contenedor.innerHTML = '';
        return;
      }

      try {
        const res = await fetch(`http://localhost:3000/api/ubicaciones?temaId=${temaId}`);
        const ubicaciones = await res.json();
        contenedor.innerHTML = ubicaciones.length
          ? '<strong>Ubicaciones guardadas:</strong><ul>' + ubicaciones.map(ubicacion => `<li>${ubicacion.nombre || 'Sin nombre'}: ${ubicacion.latitud}, ${ubicacion.longitud} (radio ${ubicacion.radio_metros} m)</li>`).join('') + '</ul>'
          : '<p>No hay ubicaciones para este tema.</p>';
      } catch (error) {
        contenedor.innerHTML = '<p>No se pudieron cargar las ubicaciones.</p>';
      }
    }

    async function registrarAlumnoATema() {
      const temaId = document.getElementById('temaAlumno').value;
      const dni = document.getElementById('alumnoDni').value.trim();

      if (!temaId || !dni) {
        alert('Seleccioná un tema e ingresá el DNI del alumno');
        return;
      }

      if (!/^[0-9]{7,8}$/.test(dni)) {
        alert('Ingresá un DNI válido (solo números)');
        return;
      }

      try {
        const res = await fetch(`http://localhost:3000/api/temas/${temaId}/alumnos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dni })
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo registrar al alumno');
          return;
        }

        alert(`Alumno ${data.nombre || ''} ${data.apellido || ''} registrado correctamente en el tema`.trim());
        document.getElementById('alumnoDni').value = '';
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function borrarTemaDocente() {
      const select = document.getElementById('temaEliminar');
      const temaId = select.value;

      if (!temaId) {
        alert('Seleccioná un tema para borrar');
        return;
      }

      if (!confirm('¿Seguro que querés borrar este tema y sus preguntas asociadas?')) {
        return;
      }

      try {
        const res = await fetch(`http://localhost:3000/api/temas/${temaId}`, {
          method: 'DELETE'
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo borrar el tema');
          return;
        }

        alert('Tema borrado correctamente');
        await cargarTemasDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function verResultadosDocente() {
      const temaId = document.getElementById('temaResultados').value;
      const contenedor = document.getElementById('contenedorResultadosDocente');

      if (!temaId) {
        contenedor.innerHTML = '<p>Seleccioná un tema para ver los resultados.</p>';
        return;
      }

      contenedor.innerHTML = '<p>Cargando resultados...</p>';

      try {
        const res = await fetch(`http://localhost:3000/api/respuestas/por-tema/${temaId}`);
        const resultados = await res.json();

        if (!resultados.length) {
          contenedor.innerHTML = '<p>No hay respuestas registradas para este tema aún.</p>';
          return;
        }

        contenedor.innerHTML = resultados.map(alumno => {
          const respuestasHtml = alumno.respuestas.map(resp => `
            <li>${resp.pregunta}: <strong>${resp.resultado}</strong> (${resp.opcion_elegida})</li>
          `).join('');

          return `
            <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
              <h3>${alumno.nombre} ${alumno.apellido}</h3>
              <p><strong>Puntaje:</strong> ${alumno.puntaje}</p>
              <ul>${respuestasHtml}</ul>
            </div>
          `;
        }).join('');
      } catch (error) {
        contenedor.innerHTML = '<p>No se pudieron cargar los resultados.</p>';
      }
    }

    async function cargarTemasDisponiblesParaInscripcion() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaInscripcion');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas disponibles</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas
          .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }))
          .forEach(tema => {
            const option = document.createElement('option');
            option.value = tema.id;
            option.textContent = tema.nombre;
            select.appendChild(option);
          });
      } catch (error) {
        document.getElementById('temaInscripcion').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function inscribirmeATema() {
      const temaId = document.getElementById('temaInscripcion').value;
      const dni = localStorage.getItem('dni');

      if (!temaId) {
        alert('Seleccioná un tema para inscribirte');
        return;
      }

      if (!dni) {
        alert('No se pudo identificar al alumno');
        return;
      }

      try {
        const res = await fetch(`http://localhost:3000/api/temas/${temaId}/alumnos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dni })
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo completar la inscripción');
          return;
        }

        alert('Te inscribiste correctamente al tema');
        await cargarMateriasAlumno();
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function cargarMateriasAlumno() {
      try {
        const alumnoId = localStorage.getItem('userId');
        const res = await fetch('http://localhost:3000/api/temas');
        const todosLosTemas = await res.json();
        const select = document.getElementById('temaSeleccionado');
        select.innerHTML = '';

        if (!alumnoId) {
          select.innerHTML = '<option value="">No se pudo identificar al alumno</option>';
          return;
        }

        const temasInscritos = [];
        for (const tema of todosLosTemas) {
          const inscripcionRes = await fetch(`http://localhost:3000/api/temas/${tema.id}/alumnos`);
          const alumnos = await inscripcionRes.json();
          if (alumnos.some(alumno => String(alumno.id) === String(alumnoId))) {
            temasInscritos.push(tema);
          }
        }

        if (!temasInscritos.length) {
          select.innerHTML = '<option value="">No estás inscripto a ningún tema</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná una materia</option>';
        temasInscritos
          .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }))
          .forEach(tema => {
            const option = document.createElement('option');
            option.value = tema.id;
            option.textContent = tema.nombre;
            select.appendChild(option);
            resumenTemas[tema.id] = resumenTemas[tema.id] || {
              nombre: tema.nombre,
              correctas: 0,
              incorrectas: 0,
              respondidas: 0
            };
          });

        select.onchange = () => {
          detenerMonitoreoUbicacion();
          temaActualId = select.value || null;
          indiceActual = 0;
          puntaje = 0;
          respuestas = [];
          preguntasRespondidasTema[temaActualId] = preguntasRespondidasTema[temaActualId] || new Set();
          iniciarMonitoreoUbicacion(temaActualId);
          cargarPreguntasPorTema(temaActualId);
        };
      } catch (error) {
        document.getElementById('temaSeleccionado').innerHTML = '<option value="">No se pudieron cargar las materias</option>';
      }
    }

    async function cargarPreguntasPorTema(temaId) {
      const contenedor = document.getElementById('preguntasAlumno');
      contenedor.innerHTML = '';

      if (!temaId) return;

      try {
        const alumnoId = localStorage.getItem('userId');
        ubicacionAlumno = await obtenerUbicacionAlumno();
        const params = new URLSearchParams({
          temaId,
          alumnoId,
          lat: ubicacionAlumno.latitud,
          lng: ubicacionAlumno.longitud,
          precision: ubicacionAlumno.precision
        });
        const res = await fetch(`http://localhost:3000/api/preguntas?${params}`);
        const preguntas = await res.json();

        if (!preguntas.length) {
          contenedor.innerHTML = '<p>No hay preguntas cercanas a tu ubicación.</p>';
          return;
        }

        preguntasActuales = filtrarPreguntasRespondidas(preguntas, temaId);
        indiceActual = 0;
        puntaje = 0;
        respuestas = [];
        if (preguntasActuales.length) {
          renderPreguntaActual();
        } else {
          finalizarCuestionario();
        }
      } catch (error) {
        contenedor.innerHTML = `<p>${error.message || 'No se pudieron cargar las preguntas.'}</p>`;
      }
    }

    function iniciarMonitoreoUbicacion(temaId) {
      detenerMonitoreoUbicacion();
      if (!temaId) return;

      consultarPreguntasCadaTresSegundos(temaId);
      intervaloUbicacion = setInterval(() => {
        consultarPreguntasCadaTresSegundos(temaId);
      }, 3000);
    }

    function detenerMonitoreoUbicacion() {
      if (intervaloUbicacion) {
        clearInterval(intervaloUbicacion);
        intervaloUbicacion = null;
      }
    }

    async function consultarPreguntasCadaTresSegundos(temaId) {
      if (consultaUbicacionEnCurso || !temaId) return;
      consultaUbicacionEnCurso = true;

      try {
        const alumnoId = localStorage.getItem('userId');
        ubicacionAlumno = await obtenerUbicacionAlumno();
        const params = new URLSearchParams({
          temaId,
          alumnoId,
          lat: ubicacionAlumno.latitud,
          lng: ubicacionAlumno.longitud,
          precision: ubicacionAlumno.precision
        });
        const res = await fetch(`http://localhost:3000/api/preguntas?${params}`);
        const preguntas = await res.json();
        if (!res.ok) throw new Error(preguntas.error || 'No se pudieron consultar las preguntas.');

        preguntas = filtrarPreguntasRespondidas(preguntas, temaId);
        const idsActuales = preguntasActuales.map(pregunta => pregunta.id).sort().join(',');
        const idsNuevos = preguntas.map(pregunta => pregunta.id).sort().join(',');

        if (idsActuales !== idsNuevos) {
          preguntasActuales = preguntas;
          indiceActual = 0;
          respuestas = [];
          if (preguntas.length) {
            renderPreguntaActual();
          } else {
            finalizarCuestionario();
          }
        }
      } catch (error) {
        console.warn('No se pudo actualizar la ubicación:', error.message);
      } finally {
        consultaUbicacionEnCurso = false;
      }
    }

    function obtenerUbicacionAlumno() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Tu navegador no permite acceder a la ubicación GPS.'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          ({ coords }) => resolve({ latitud: coords.latitude, longitud: coords.longitude, precision: coords.accuracy || 0 }),
          () => reject(new Error('Debés permitir el acceso a tu ubicación para ver preguntas cercanas.')),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    function renderPreguntaActual() {
      const contenedor = document.getElementById('preguntasAlumno');

      if (!preguntasActuales.length) {
        contenedor.innerHTML = '<p>No hay preguntas cargadas para esta materia.</p>';
        return;
      }

      const pregunta = preguntasActuales[indiceActual];
      if (!pregunta) return;

      detenerMonitoreoUbicacion();

      const card = document.createElement('div');
      card.innerHTML = `
        <div style="margin-bottom:8px; font-weight:bold;">Puntaje: ${puntaje}</div>
        <h3>${indiceActual + 1}. ${pregunta.enunciado}</h3>
        ${pregunta.opciones.map(opcion => `<label><input type="radio" name="pregunta-${pregunta.id}" value="${opcion.id}"> ${opcion.texto}</label><br>`).join('')}
        <p id="resultado-${pregunta.id}" style="margin-top:8px; font-weight:bold;"></p>
        <button id="btnSiguiente" type="button" style="margin-top:10px;" disabled>Siguiente</button>
      `;

      const radios = card.querySelectorAll('input[type="radio"]');
      const botonSiguiente = card.querySelector('#btnSiguiente');
      let respuestaEnviada = false;

      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          const resultado = document.getElementById(`resultado-${pregunta.id}`);
          respuestas = respuestas.filter(item => item.id !== pregunta.id);
          respuestas.push({ id: pregunta.id, opcionId: Number(radio.value) });
          botonSiguiente.disabled = false;
          resultado.textContent = 'Respuesta seleccionada';
          resultado.style.color = 'inherit';
        });
      });

      botonSiguiente.addEventListener('click', async () => {
        const respuesta = respuestas.find(item => item.id === pregunta.id);
        if (!respuesta) return;

        if (respuestaEnviada) {
          preguntasActuales = preguntasActuales.filter(item => item.id !== pregunta.id);
          if (preguntasActuales.length) {
            indiceActual = Math.min(indiceActual, preguntasActuales.length - 1);
            renderPreguntaActual();
          } else {
            finalizarCuestionario();
          }
          return;
        }

        botonSiguiente.disabled = true;
        try {
          const res = await fetch('http://localhost:3000/api/respuestas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              alumnoId: localStorage.getItem('userId'),
              preguntaId: pregunta.id,
              opcionId: respuesta.opcionId,
              latitud: ubicacionAlumno.latitud,
              longitud: ubicacionAlumno.longitud,
              precision: ubicacionAlumno.precision
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'No se pudo registrar la respuesta.');
          puntaje += data.esCorrecta ? 1 : 0;
          const resumen = resumenTemas[temaActualId] || {
            nombre: document.querySelector('#temaSeleccionado option:checked')?.textContent || 'Tema',
            correctas: 0,
            incorrectas: 0,
            respondidas: 0
          };
          resumen.respondidas += 1;
          if (data.esCorrecta) {
            resumen.correctas += 1;
          } else {
            resumen.incorrectas += 1;
          }
          resumenTemas[temaActualId] = resumen;
          preguntasRespondidasTema[temaActualId].add(pregunta.id);
          respuestaEnviada = true;

          radios.forEach((radio) => {
            const etiqueta = radio.closest('label');
            if (Number(radio.value) !== respuesta.opcionId) {
              etiqueta?.remove();
            } else {
              radio.checked = true;
              radio.disabled = true;
            }
          });

          document.getElementById(`resultado-${pregunta.id}`).textContent = data.esCorrecta
            ? 'Correcto'
            : 'Incorrecto';
          document.getElementById(`resultado-${pregunta.id}`).style.color = data.esCorrecta ? 'green' : 'crimson';
          botonSiguiente.textContent = indiceActual < preguntasActuales.length - 1 ? 'Siguiente' : 'Finalizar';
          botonSiguiente.disabled = false;
          return;
        } catch (error) {
          alert(error.message);
          botonSiguiente.disabled = false;
          return;
        }
      });

      contenedor.innerHTML = '';
      contenedor.appendChild(card);
    }

    function finalizarCuestionario() {
      detenerMonitoreoUbicacion();
      const contenedor = document.getElementById('preguntasAlumno');
      const resumenActual = resumenTemas[temaActualId];
      const filas = Object.values(resumenTemas)
        .filter(resumen => resumen.respondidas > 0)
        .map(resumen => `
          <tr>
            <td>${resumen.nombre}</td>
            <td>${resumen.correctas}</td>
            <td>${resumen.incorrectas}</td>
            <td>${resumen.respondidas}</td>
          </tr>
        `).join('');

      contenedor.innerHTML = `
        <h2>Resumen de respuestas</h2>
        <p>Terminaste las preguntas disponibles de <strong>${resumenActual?.nombre || 'este tema'}</strong>.</p>
        <p>Puntaje del tema: <strong>${puntaje}</strong></p>
        <table style="width:100%; border-collapse:collapse; margin-top:16px;">
          <thead>
            <tr>
              <th style="text-align:left;">Tema</th>
              <th>Correctas</th>
              <th>Incorrectas</th>
              <th>Respondidas</th>
            </tr>
          </thead>
          <tbody>${filas}</tbody>
        </table>
        <p style="margin-top:16px;">Podés seleccionar otro tema para continuar.</p>
        <button type="button" onclick="window.location.href='resultados.html'">Ver mis resultados por materia</button>
      `;
    }

    function filtrarPreguntasRespondidas(preguntas, temaId) {
      const respondidas = preguntasRespondidasTema[temaId] || new Set();
      return preguntas.filter(pregunta => !respondidas.has(pregunta.id));
    }

    function cerrarSesion() {
      detenerMonitoreoUbicacion();
      localStorage.removeItem('rol');
      localStorage.removeItem('dni');
      localStorage.removeItem('email');
      localStorage.removeItem('nombre');
      localStorage.removeItem('userId');
      localStorage.removeItem('docenteId');
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'index.html';
    }
  </script>

</body>
