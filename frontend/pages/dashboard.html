<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoQuiz - Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <div class="app" id="app">

    <header class="topbar">
      <div class="marca">
        <span class="marca-nombre">GeoQuiz</span>
        <span class="marca-sub" id="bienvenida">Hola</span>
      </div>
      <div class="topbar-acciones">
        <span class="chip-demo">Datos de ejemplo</span>
        <button class="btn-salir" id="btnCerrarSesion">Cerrar sesión</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidenav" id="sidenav"></nav>

      <main class="contenido" id="contenido"></main>
    </div>

    <nav class="bottomnav" id="bottomnav"></nav>

  </div>

  <script src="../js/main.js"></script>
</body>
</html>
