<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoQuiz</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <h1>GeoQuiz</h1>

  <div id="panel-docente" style="display:none;">
    <h2>Panel Docente</h2>

    <div class="campo">
      <label for="temaDocente">Tema / materia</label>
      <input type="text" id="temaDocente" placeholder="Ej: Programación, Hardware, Biología">
    </div>

    <div class="campo">
      <label for="preguntaDocente">Pregunta</label>
      <input type="text" id="preguntaDocente" placeholder="Ej: ¿Qué lenguaje se usa para crear páginas web?">
    </div>

    <div class="campo">
      <label for="opcion1">Opción 1</label>
      <input type="text" id="opcion1" placeholder="Respuesta 1">
    </div>

    <div class="campo">
      <label for="opcion2">Opción 2</label>
      <input type="text" id="opcion2" placeholder="Respuesta 2">
    </div>

    <div class="campo">
      <label for="opcion3">Opción 3</label>
      <input type="text" id="opcion3" placeholder="Respuesta 3">
    </div>

    <div class="campo">
      <label for="respuestaCorrecta">Respuesta correcta</label>
      <select id="respuestaCorrecta">
        <option value="1">Opción 1</option>
        <option value="2">Opción 2</option>
        <option value="3">Opción 3</option>
      </select>
    </div>

    <div class="campo">
      <label for="temaEliminar">Eliminar tema</label>
      <select id="temaEliminar">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="temaResultados">Ver resultados de alumnos</label>
      <select id="temaResultados">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <button class="ingresar" id="btnGuardarPregunta">Guardar pregunta</button>
    <button class="ingresar" id="btnBorrarTema" type="button" style="margin-top:8px;">Borrar tema seleccionado</button>
    <button class="ingresar" id="btnVerResultados" type="button" style="margin-top:8px;">Ver resultados</button>

    <div id="contenedorResultadosDocente" style="margin-top:16px;"></div>

    <h3 style="margin-top:24px;">Ubicaciones GPS</h3>

    <div class="campo">
      <label for="temaUbicacion">Tema</label>
      <select id="temaUbicacion">
        <option value="">Cargando temas...</option>
      </select>
    </div>

    <div class="campo">
      <label for="nombreUbicacion">Nombre de ubicación</label>
      <input type="text" id="nombreUbicacion" placeholder="Ej: Plaza Central">
    </div>

    <div class="campo">
      <label for="latitudUbicacion">Latitud</label>
      <input type="number" step="any" id="latitudUbicacion" placeholder="Ej: -34.6037">
    </div>

    <div class="campo">
      <label for="longitudUbicacion">Longitud</label>
      <input type="number" step="any" id="longitudUbicacion" placeholder="Ej: -58.3816">
    </div>

    <div class="campo">
      <label for="radioUbicacion">Radio (metros)</label>
      <input type="number" id="radioUbicacion" value="50">
    </div>

    <input type="hidden" id="ubicacionEditandoId" value="">

    <button class="ingresar" id="btnGuardarUbicacion">Guardar ubicación</button>
    <button class="ingresar" id="btnCancelarEdicion" type="button" style="margin-top:8px; display:none;">Cancelar edición</button>

    <div id="listaUbicaciones" style="margin-top:16px;"></div>
  </div>

  <div id="panel-alumno" style="display:none;">
    <h2>Panel Alumno</h2>

    <div class="campo">
      <label for="temaSeleccionado">Elegí una materia</label>
      <select id="temaSeleccionado">
        <option value="">Cargando materias...</option>
      </select>
    </div>

    <div id="preguntasAlumno"></div>
  </div>

  <script>
    const rol = localStorage.getItem('rol');
    const ocultarKey = 'geoquiz_preguntas_ocultas_hasta';
    let preguntasActuales = [];
    let indiceActual = 0;
    let puntaje = 0;
    let respuestas = [];

    if (rol === 'docente') {
      document.getElementById('panel-docente').style.display = 'block';
      document.getElementById('btnGuardarPregunta').addEventListener('click', guardarPreguntaDocente);
      document.getElementById('btnBorrarTema').addEventListener('click', borrarTemaDocente);
      document.getElementById('btnVerResultados').addEventListener('click', verResultadosDocente);
      document.getElementById('btnGuardarUbicacion').addEventListener('click', guardarUbicacion);
      document.getElementById('btnCancelarEdicion').addEventListener('click', cancelarEdicionUbicacion);
      document.getElementById('temaUbicacion').addEventListener('change', function () {
        cargarUbicaciones(this.value);
      });
      cargarTemasDocente();
      cargarTemasDocenteResultados();
      cargarTemasUbicacion();
    } else {
      document.getElementById('panel-alumno').style.display = 'block';
      cargarMateriasAlumno();
      verificarOcultamiento();
    }

    async function guardarPreguntaDocente() {
      const temaNombre = document.getElementById('temaDocente').value.trim();
      const pregunta = document.getElementById('preguntaDocente').value.trim();
      const opciones = [
        document.getElementById('opcion1').value.trim(),
        document.getElementById('opcion2').value.trim(),
        document.getElementById('opcion3').value.trim()
      ];
      const correcta = document.getElementById('respuestaCorrecta').value;

      if (!temaNombre || !pregunta || opciones.some(op => !op)) {
        alert('Completá tema, pregunta y las 3 opciones.');
        return;
      }

      try {
        const temaRes = await fetch('http://localhost:3000/api/temas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: temaNombre, descripcion: 'Materia creada desde el panel docente' })
        });

        const temaData = await temaRes.json();
        if (!temaRes.ok) {
          alert(temaData.error || 'No se pudo crear el tema');
          return;
        }

        const preguntaRes = await fetch('http://localhost:3000/api/preguntas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            temaId: temaData.id,
            enunciado: pregunta,
            opciones,
            respuestaCorrecta: Number(correcta)
          })
        });

        const preguntaData = await preguntaRes.json();
        if (!preguntaRes.ok) {
          alert(preguntaData.error || 'No se pudo guardar la pregunta');
          return;
        }

        alert('Pregunta guardada correctamente');
        document.getElementById('temaDocente').value = '';
        document.getElementById('preguntaDocente').value = '';
        document.getElementById('opcion1').value = '';
        document.getElementById('opcion2').value = '';
        document.getElementById('opcion3').value = '';
        await cargarTemasDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function cargarTemasDocente() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaEliminar');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas para borrar</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaEliminar').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function cargarTemasDocenteResultados() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaResultados');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas para ver resultados</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaResultados').innerHTML = '<option value="">No se pudieron cargar los temas</option>';
      }
    }

    async function borrarTemaDocente() {
      const select = document.getElementById('temaEliminar');
      const temaId = select.value;

      if (!temaId) {
        alert('Seleccioná un tema para borrar');
        return;
      }

      if (!confirm('¿Seguro que querés borrar este tema y sus preguntas asociadas?')) {
        return;
      }

      try {
        const res = await fetch(`http://localhost:3000/api/temas/${temaId}`, {
          method: 'DELETE'
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo borrar el tema');
          return;
        }

        alert('Tema borrado correctamente');
        await cargarTemasDocente();
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    async function verResultadosDocente() {
      const temaId = document.getElementById('temaResultados').value;
      const contenedor = document.getElementById('contenedorResultadosDocente');

      if (!temaId) {
        contenedor.innerHTML = '<p>Seleccioná un tema para ver los resultados.</p>';
        return;
      }

      contenedor.innerHTML = '<p>Cargando resultados...</p>';

      try {
        const res = await fetch(`http://localhost:3000/api/respuestas/por-tema/${temaId}`);
        const resultados = await res.json();

        if (!resultados.length) {
          contenedor.innerHTML = '<p>No hay respuestas registradas para este tema aún.</p>';
          return;
        }

        contenedor.innerHTML = resultados.map(alumno => {
          const respuestasHtml = alumno.respuestas.map(resp => `
            <li>${resp.pregunta}: <strong>${resp.resultado}</strong> (${resp.opcion_elegida})</li>
          `).join('');

          return `
            <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
              <h3>${alumno.nombre} ${alumno.apellido}</h3>
              <p><strong>Puntaje:</strong> ${alumno.puntaje}</p>
              <ul>${respuestasHtml}</ul>
            </div>
          `;
        }).join('');
      } catch (error) {
        contenedor.innerHTML = '<p>No se pudieron cargar los resultados.</p>';
      }
    }

    async function cargarMateriasAlumno() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaSeleccionado');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay materias cargadas</option>';
          return;
        }

        const temasUnicos = new Map();
        const normalizarTemaNombre = (nombre = '') => String(nombre)
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/\s+/g, ' ')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();

        temas.forEach(tema => {
          const clave = normalizarTemaNombre(tema.nombre);
          if (!clave || temasUnicos.has(clave)) return;
          temasUnicos.set(clave, tema);
        });

        select.innerHTML = '<option value="">Seleccioná una materia</option>';
        Array.from(temasUnicos.values())
          .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }))
          .forEach(tema => {
            const option = document.createElement('option');
            option.value = tema.id;
            option.textContent = tema.nombre;
            select.appendChild(option);
          });

        select.onchange = () => {
          indiceActual = 0;
          puntaje = 0;
          respuestas = [];
          cargarPreguntasPorTema(select.value);
        };
      } catch (error) {
        document.getElementById('temaSeleccionado').innerHTML = '<option value="">No se pudieron cargar las materias</option>';
      }
    }

    function verificarOcultamiento() {
      const hasta = Number(localStorage.getItem(ocultarKey) || 0);
      if (!hasta || Date.now() >= hasta) {
        localStorage.removeItem(ocultarKey);
        return;
      }

      mostrarMensajeOcultado(hasta);
    }

    function mostrarMensajeOcultado(hasta) {
      const contenedor = document.getElementById('preguntasAlumno');
      const tiempoRestante = Math.max(0, Math.ceil((hasta - Date.now()) / 1000));
      contenedor.innerHTML = `<p>Ya respondiste todas las preguntas. Las volverán a aparecer en ${tiempoRestante} segundos.</p>`;

      setTimeout(() => {
        if (Date.now() >= hasta) {
          localStorage.removeItem(ocultarKey);
          const temaId = document.getElementById('temaSeleccionado').value;
          if (temaId) {
            cargarPreguntasPorTema(temaId);
          }
        } else {
          mostrarMensajeOcultado(hasta);
        }
      }, 1000);
    }

    async function cargarPreguntasPorTema(temaId) {
      const contenedor = document.getElementById('preguntasAlumno');
      contenedor.innerHTML = '';

      if (!temaId) return;

      if (Number(localStorage.getItem(ocultarKey) || 0) > Date.now()) {
        verificarOcultamiento();
        return;
      }

      contenedor.innerHTML = '<p>Obteniendo ubicación GPS...</p>';

      let latParam = '';
      let lngParam = '';

      try {
        const posicion = await new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('no geolocation'));
            return;
          }
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
        });

        latParam = `&lat=${posicion.coords.latitude}`;
        lngParam = `&lng=${posicion.coords.longitude}`;
      } catch (e) {
        contenedor.innerHTML = '<p>Sin GPS, mostrando todas las preguntas.</p>';
      }

      try {
        const res = await fetch(`http://localhost:3000/api/preguntas?temaId=${temaId}${latParam}${lngParam}`);
        const preguntas = await res.json();

        contenedor.innerHTML = '';

        if (!preguntas.length) {
          contenedor.innerHTML = '<p>No hay preguntas disponibles en tu ubicación.</p>';
          return;
        }

        preguntasActuales = preguntas;
        indiceActual = 0;
        puntaje = 0;
        respuestas = [];
        renderPreguntaActual();
      } catch (error) {
        contenedor.innerHTML = '<p>No se pudieron cargar las preguntas.</p>';
      }
    }

    function renderPreguntaActual() {
      const contenedor = document.getElementById('preguntasAlumno');

      if (!preguntasActuales.length) {
        contenedor.innerHTML = '<p>No hay preguntas cargadas para esta materia.</p>';
        return;
      }

      const pregunta = preguntasActuales[indiceActual];
      if (!pregunta) return;

      const card = document.createElement('div');
      card.innerHTML = `
        <div style="margin-bottom:8px; font-weight:bold;">Puntaje: ${puntaje}</div>
        <h3>${indiceActual + 1}. ${pregunta.enunciado}</h3>
        <label><input type="radio" name="pregunta-${pregunta.id}" value="1"> ${pregunta.opcion1}</label><br>
        <label><input type="radio" name="pregunta-${pregunta.id}" value="2"> ${pregunta.opcion2}</label><br>
        <label><input type="radio" name="pregunta-${pregunta.id}" value="3"> ${pregunta.opcion3}</label>
        <p id="resultado-${pregunta.id}" style="margin-top:8px; font-weight:bold;"></p>
        <button id="btnSiguiente" type="button" style="margin-top:10px;" disabled>Siguiente</button>
      `;

      const radios = card.querySelectorAll('input[type="radio"]');
      const botonSiguiente = card.querySelector('#btnSiguiente');

      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          const resultado = document.getElementById(`resultado-${pregunta.id}`);
          const seleccionada = Number(radio.value);
          const correcta = Number(pregunta.correcta);
          const respuestaExistente = respuestas.find(item => item.id === pregunta.id);

          if (respuestaExistente) {
            if (respuestaExistente.correcta) {
              puntaje -= 1;
            }
            respuestas = respuestas.filter(item => item.id !== pregunta.id);
          }

          const esCorrecta = seleccionada === correcta;
          if (esCorrecta) {
            puntaje += 1;
          }

          respuestas.push({ id: pregunta.id, correcta: esCorrecta, seleccion: seleccionada });
          botonSiguiente.disabled = false;

          if (esCorrecta) {
            resultado.textContent = 'Correcto';
            resultado.style.color = 'green';
          } else {
            resultado.textContent = 'Incorrecto';
            resultado.style.color = 'crimson';
          }

          const resumen = card.querySelector('div');
          if (resumen) {
            resumen.textContent = `Puntaje: ${puntaje}`;
          }
        });
      });

      botonSiguiente.addEventListener('click', () => {
        if (indiceActual < preguntasActuales.length - 1) {
          indiceActual += 1;
          renderPreguntaActual();
        } else {
          finalizarCuestionario();
        }
      });

      contenedor.innerHTML = '';
      contenedor.appendChild(card);
    }

    function finalizarCuestionario() {
      const contenedor = document.getElementById('preguntasAlumno');
      const hasta = Date.now() + 5 * 60 * 1000;
      localStorage.setItem(ocultarKey, hasta);
      contenedor.innerHTML = `
        <p>Respondiste todas las preguntas.</p>
        <p>Puntaje final: <strong>${puntaje}</strong></p>
        <p>Las preguntas se ocultarán por 5 minutos.</p>
      `;
      mostrarMensajeOcultado(hasta);
    }

    async function cargarTemasUbicacion() {
      try {
        const res = await fetch('http://localhost:3000/api/temas');
        const temas = await res.json();
        const select = document.getElementById('temaUbicacion');
        select.innerHTML = '';

        if (!temas.length) {
          select.innerHTML = '<option value="">No hay temas disponibles</option>';
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un tema</option>';
        temas.forEach(tema => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        document.getElementById('temaUbicacion').innerHTML = '<option value="">Error al cargar temas</option>';
      }
    }

    async function cargarUbicaciones(temaId) {
      const contenedor = document.getElementById('listaUbicaciones');
      contenedor.innerHTML = '';

      if (!temaId) return;

      try {
        const res = await fetch(`http://localhost:3000/api/ubicaciones?temaId=${temaId}`);
        const ubicaciones = await res.json();

        if (!ubicaciones.length) {
          contenedor.innerHTML = '<p>No hay ubicaciones para este tema.</p>';
          return;
        }

        contenedor.innerHTML = ubicaciones.map(ub => `
          <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            <p><strong>${ub.nombre || 'Sin nombre'}</strong></p>
            <p>Lat: ${ub.latitud} | Lng: ${ub.longitud} | Radio: ${ub.radio_metros}m</p>
            <button onclick="editarUbicacion(${ub.id}, '${(ub.nombre || '').replace(/'/g, "\\'")}', ${ub.latitud}, ${ub.longitud}, ${ub.radio_metros})">Editar</button>
            <button onclick="eliminarUbicacion(${ub.id})">Eliminar</button>
          </div>
        `).join('');
      } catch (error) {
        contenedor.innerHTML = '<p>Error al cargar ubicaciones.</p>';
      }
    }

    async function guardarUbicacion() {
      const temaId = document.getElementById('temaUbicacion').value;
      const nombre = document.getElementById('nombreUbicacion').value.trim();
      const latitud = parseFloat(document.getElementById('latitudUbicacion').value);
      const longitud = parseFloat(document.getElementById('longitudUbicacion').value);
      const radio_metros = parseInt(document.getElementById('radioUbicacion').value) || 50;
      const editandoId = document.getElementById('ubicacionEditandoId').value;

      if (!temaId || isNaN(latitud) || isNaN(longitud)) {
        alert('Completá tema, latitud y longitud.');
        return;
      }

      const body = { temaId, nombre, latitud, longitud, radio_metros };

      try {
        let res;
        if (editandoId) {
          res = await fetch(`http://localhost:3000/api/ubicaciones/${editandoId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, latitud, longitud, radio_metros })
          });
        } else {
          res = await fetch('http://localhost:3000/api/ubicaciones', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo guardar la ubicación');
          return;
        }

        alert(editandoId ? 'Ubicación actualizada' : 'Ubicación creada');
        limpiarFormularioUbicacion();
        await cargarUbicaciones(temaId);
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    }

    function editarUbicacion(id, nombre, latitud, longitud, radio_metros) {
      document.getElementById('nombreUbicacion').value = nombre;
      document.getElementById('latitudUbicacion').value = latitud;
      document.getElementById('longitudUbicacion').value = longitud;
      document.getElementById('radioUbicacion').value = radio_metros;
      document.getElementById('ubicacionEditandoId').value = id;
      document.getElementById('btnCancelarEdicion').style.display = 'block';
    }

    function cancelarEdicionUbicacion() {
      limpiarFormularioUbicacion();
    }

    function limpiarFormularioUbicacion() {
      document.getElementById('nombreUbicacion').value = '';
      document.getElementById('latitudUbicacion').value = '';
      document.getElementById('longitudUbicacion').value = '';
      document.getElementById('radioUbicacion').value = '50';
      document.getElementById('ubicacionEditandoId').value = '';
      document.getElementById('btnCancelarEdicion').style.display = 'none';
    }

    window.eliminarUbicacion = async function (id) {
      if (!confirm('¿Seguro que querés eliminar esta ubicación?')) return;

      try {
        const res = await fetch(`http://localhost:3000/api/ubicaciones/${id}`, {
          method: 'DELETE'
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'No se pudo eliminar');
          return;
        }

        alert('Ubicación eliminada');
        const temaId = document.getElementById('temaUbicacion').value;
        if (temaId) await cargarUbicaciones(temaId);
      } catch (error) {
        alert('No se pudo conectar con el servidor');
      }
    };

    window.editarUbicacion = editarUbicacion;
  </script>

</body>
