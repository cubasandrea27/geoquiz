<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#557945">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/notificaciones.css">
  <title>GeoQuiz Móvil</title>
</head>
<body style="padding:16px; min-height:100vh;">
  <main style="width:100%; max-width:520px; margin:0 auto;">
    <header style="color:white; margin-bottom:20px;"><h1>GeoQuiz</h1><p id="usuario">Cargando...</p></header>
    <section id="notificaciones" style="margin-bottom:18px;"></section>
    <select id="temas" aria-label="Temas"><option>Cargando...</option></select>
    <button class="ingresar" id="inscribirse">Inscribirme</button>
    <p id="estadoGps" aria-live="polite" style="margin-top:12px;"></p>
    <button class="ingresar" id="reintentarGps" style="display:none;">Reintentar ubicación</button>
    <section id="quiz" style="margin-top:20px; display:none;"></section>
    <button class="ingresar" id="resultados" style="margin-top:16px;">Ver resultados</button>
    <button class="ingresar" id="instalar" style="margin-top:10px; display:none;">Instalar GeoQuiz</button>
    <button class="ingresar" id="cerrar" style="margin-top:10px; background:transparent; color:var(--texto); border:1px solid var(--borde-fuerte);">Cerrar sesión</button>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script>
    let token = localStorage.getItem('token');
    let alumnoId = localStorage.getItem('userId');
    let temaId = null;
    let pregunta = null;
    let ubicacion = null; // { latitud, longitud, precision } del GPS del alumno
    let deferredInstallPrompt = null;

    if (!token || localStorage.getItem('rol') !== 'alumno') {
      window.location.href = 'index.html';
      throw new Error('No autenticado');
    }
    navigator.serviceWorker.register('../service-worker.js').catch(() => {});
    document.getElementById('usuario').textContent = localStorage.getItem('nombre') || 'Alumno';
    document.getElementById('reintentarGps').addEventListener('click', cargarQuiz);
    document.getElementById('cerrar').addEventListener('click', () => { borrarSesion(); window.location.href = 'index.html'; });
    document.getElementById('inscribirse').addEventListener('click', inscribirse);
    document.getElementById('resultados').addEventListener('click', () => window.location.href = 'resultados.html');

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      document.getElementById('instalar').style.display = 'block';
    });

    document.getElementById('instalar').addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        document.getElementById('instalar').style.display = 'none';
      }
      deferredInstallPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('instalar').style.display = 'none';
    });

    cargarTemas(); cargarNotificaciones();

    async function cargarTemas() {
      const response = await fetchConToken(`${API_BASE}/api/temas`);
      const temas = await leerJson(response);
      const select = document.getElementById('temas');
      select.innerHTML = '<option value="">Selecciona un tema</option>' + temas.map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');
      select.onchange = () => { temaId = select.value; cargarQuiz(); };
    }

    // Pide la ubicación al navegador. Si falla, explica el motivo.
    function obtenerUbicacion() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Tu navegador no permite usar el GPS.'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => resolve({ latitud: coords.latitude, longitud: coords.longitude, precision: coords.accuracy || 0 }),
          (error) => {
            if (error.code === 1) reject(new Error('Tenés que permitir el acceso a la ubicación. Activalo en el navegador y tocá "Reintentar ubicación".'));
            else if (error.code === 3) reject(new Error('El GPS tardó demasiado. Probá de nuevo al aire libre.'));
            else reject(new Error('No se pudo obtener tu ubicación. Revisá que el GPS esté activado.'));
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    }

    async function cargarQuiz() {
      if (!temaId || !alumnoId) return;
      const estado = document.getElementById('estadoGps');
      const botonReintentar = document.getElementById('reintentarGps');
      document.getElementById('quiz').style.display = 'none';
      botonReintentar.style.display = 'none';
      estado.textContent = 'Obteniendo tu ubicación...';

      try {
        ubicacion = await obtenerUbicacion();
      } catch (error) {
        estado.textContent = error.message;
        botonReintentar.style.display = 'block';
        return;
      }

      estado.textContent = `Ubicación obtenida (precisión: ${Math.round(ubicacion.precision)} m)`;
      botonReintentar.style.display = 'block';
      botonReintentar.textContent = 'Actualizar ubicación';

      const params = new URLSearchParams({ temaId, lat: ubicacion.latitud, lng: ubicacion.longitud, precision: ubicacion.precision });
      const response = await fetchConToken(`${API_BASE}/api/preguntas?${params}`);
      const preguntas = await leerJson(response);
      if (!response.ok) return mostrarNotificacion(mensajeDeError(response, preguntas, 'No se pudieron cargar las preguntas.'), 'error');
      if (!preguntas.length) return mostrarNotificacion('No hay preguntas cercanas.', 'info');
      pregunta = preguntas[0];
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('quiz').innerHTML = `<h2>${pregunta.enunciado}</h2>${pregunta.opciones.map(o => `<label><input type="radio" name="opcion" value="${o.id}"> ${o.texto}</label><br>`).join('')}<button class="ingresar" id="enviar">Responder</button>`;
      document.getElementById('enviar').addEventListener('click', enviarRespuesta);
    }

    async function inscribirse() {
      const response = await fetchConToken(`${API_BASE}/api/tema-alumno`, {
        method:'POST',
        headers: { 'Content-Type':'application/json' },
        body:JSON.stringify({temaId})
      });
      const data = await leerJson(response);
      if (!response.ok) return mostrarNotificacion(mensajeDeError(response, data, 'No se pudo completar la operación.'), 'error');
      mostrarNotificacion(data.message, 'exito');
    }

    async function enviarRespuesta() {
      const opcion = document.querySelector('input[name="opcion"]:checked');
      if (!opcion) return mostrarNotificacion('Selecciona una respuesta.', 'error');
      const response = await fetchConToken(`${API_BASE}/api/respuestas`, {
        method:'POST',
        headers: { 'Content-Type':'application/json' },
        body:JSON.stringify({preguntaId:pregunta.id, opcionId:Number(opcion.value), latitud:ubicacion.latitud, longitud:ubicacion.longitud, precision:ubicacion.precision})
      });
      const data = await leerJson(response);
      if (!response.ok) return mostrarNotificacion(mensajeDeError(response, data, 'No se pudo completar la operación.'), 'error');
      // La corrección la decide el servidor
      mostrarNotificacion(data.esCorrecta ? '¡Correcto!' : 'Incorrecto', data.esCorrecta ? 'exito' : 'error');
      document.getElementById('quiz').style.display = 'none';
    }

    async function cargarNotificaciones() {
      const response = await fetchConToken(`${API_BASE}/api/notificaciones?userType=alumno&userId=${alumnoId}`);
      const notifications = await leerJson(response);
      document.getElementById('notificaciones').innerHTML = notifications.length ? notifications.map(n => `<article style="padding:12px;background:var(--superficie-2);border-radius:7px;margin-bottom:8px"><strong>${n.titulo}</strong><p>${n.mensaje}</p></article>`).join('') : '<p>No hay notificaciones.</p>';
    }
  </script>
</body>
</html>
